name: Navegador local (IndexedDB real)

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias de prueba
        run: python -m pip install -r requirements-dev.txt

      - name: Instalar Chromium para Playwright
        run: python -m playwright install --with-deps chromium firefox

      - name: Instalar Three.js local para visor 0.3B.1
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validar JavaScript del HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("app/index.html").read_text(encoding="utf-8")
          assert source.count("<script>") == 1 and source.count("</script>") >= 1
          Path("/tmp/archivito-inline.js").write_text(
              source.split("<script>", 1)[1].split("</script>", 1)[0],
              encoding="utf-8",
          )
          PY
          node --check /tmp/archivito-inline.js
          node --check app/archive-v3.js
          node --check app/local-generation.js
          node --check app/backup-plan.js
          node --check app/image-mobile.js
          node --check app/capture-existing.js
          node --check app/perspective.js
          node --check app/paper-math.js
          node --check app/visor-3d-data.js
          node --check app/visor-three.js
          node --check app/crypto-v4.js
          node --check app/backup-v4.js
          python - <<'PY'
          from pathlib import Path
          source = Path("app/digitalizar.html").read_text(encoding="utf-8")
          assert source.count("<script>") == 1
          assert source.count("</script>") >= 1
          Path("/tmp/archivito-digitalizar.js").write_text(
              source.split("<script>",1)[1].split("</script>",1)[0],encoding="utf-8"
          )
          PY
          node --check /tmp/archivito-digitalizar.js

      - name: Probar homografía y recorte matemático
        run: node --test tests/test_perspective.cjs

      - name: Probar geometría del papel
        run: node --test tests/test_paper_math.cjs

      - name: Probar persistencia y respaldo en navegador real
        run: python -m unittest discover -s tests -v
