name: Supabase local — promotion rollback E5
on:
  pull_request:
    paths:
      - 'tests/remote/test_supabase_local_closed_stack.py'
      - 'tests/remote/test_supabase_local_promotion_rollback.py'
      - 'tests/remote/fixtures/edge_v1_legacy.ts'
      - 'docs/sql/cloud_03_5c3b*.sql'
      - 'supabase/functions/archivito-sync-incremental/**'
      - 'server/sync-incremental*.mjs'
      - 'app/sync-incremental*.mjs'
      - 'app/shared-crypto.mjs'
      - 'app/sync-v3-contract.mjs'
      - '.github/workflows/incremental-supabase-promotion.yml'
permissions:
  contents: read
jobs:
  supabase-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ARCHIVITO_DISPOSABLE_LAB: supabase-e5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: 2.122.0
      - name: Verify CLI, Docker and Python
        run: |
          supabase --version
          docker version --format '{{.Server.Version}}'
          python3 -m venv "$RUNNER_TEMP/archivito-e3-venv"
          "$RUNNER_TEMP/archivito-e3-venv/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3
          "$RUNNER_TEMP/archivito-e3-venv/bin/python" -m py_compile tests/remote/test_supabase_local_closed_stack.py tests/remote/test_supabase_local_promotion_rollback.py
      - name: Rehearse local committed promotion and rollback
        run: |
          "$RUNNER_TEMP/archivito-e3-venv/bin/python" tests/remote/test_supabase_local_promotion_rollback.py
