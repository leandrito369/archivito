name: Cloudflare Pages — compilación estática (sin despliegue)

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pages-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias fijadas
        run: npm install --include=dev --no-audit --no-fund
      - name: Evidencia temporal de lockfile npm (sin datos de usuario)
        run: |
          node -e 'console.log("ARCHIVITO_LOCK_BEGIN");console.log(require("node:fs").readFileSync("package-lock.json","utf8"));console.log("ARCHIVITO_LOCK_END")'
      - name: Compilar y comprobar archivos públicos
        run: |
          npm run build:pages
          npm run test:pages
          npm run test:auth
